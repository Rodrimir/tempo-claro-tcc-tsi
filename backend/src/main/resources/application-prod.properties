# ===============================
# BANCO DE DADOS POSTGRESQL NEON
#
# Nada de credencial literal neste arquivo: ele é versionado e o repositório é
# público. As três variáveis abaixo são obrigatórias no ambiente (painel do
# Render) — sem elas a aplicação não sobe, que é o comportamento desejado.
#
# ATENÇÃO: a senha que ficava aqui está no histórico do Git. Removê-la do arquivo
# não a torna secreta — ela precisa ser ROTACIONADA no painel da Neon.
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Inicialização do banco (Cria as tabelas usando schema.sql)
spring.sql.init.mode=always

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Porta dinâmica (se necessária pela plataforma cloud)
server.port=${PORT:8084}

# ===============================
# SEGURANÇA
# ===============================
# Sem default: um segredo de assinatura embutido no código-fonte versionado não é
# segredo nenhum. HS512 exige pelo menos 64 bytes — JwtConfig confere na subida.
jwt.secret=${JWT_SECRET}

# O log de requisições imprime o corpo inteiro, incluindo as senhas em claro de
# /auth/login, /auth/register e /profile. Nunca ligado em produção.
app.request-logging.enabled=false

# Origens permitidas, separadas por vírgula. "*" liberaria a API para qualquer site.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://tempo-claro-tcc-tsi.vercel.app}

# A documentação interativa não fica exposta em produção (§5.1 da monografia:
# apenas registro e login são rotas públicas).
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ===============================
# HIKARI
# ===============================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
