# ===============================
# BANCO DE DADOS POSTGRESQL NEON
#
# Nada de credencial literal neste arquivo: ele é versionado e o repositório é
# público. As três variáveis abaixo são obrigatórias no ambiente (painel do
# Render) — sem elas a aplicação não sobe, que é o comportamento desejado.
#
# ATENÇÃO: a senha que ficava aqui está no histórico do Git. Removê-la do arquivo
# não a torna secreta — ela precisa ser ROTACIONADA no painel da Neon.
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Inicialização do banco (Cria as tabelas usando schema.sql)
spring.sql.init.mode=always

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Porta dinâmica (se necessária pela plataforma cloud)
server.port=${PORT:8084}

# ===============================
# SEGURANÇA
# ===============================
# Sem default: um segredo de assinatura embutido no código-fonte versionado não é
# segredo nenhum. HS512 exige pelo menos 64 bytes — JwtConfig confere na subida.
jwt.secret=${JWT_SECRET}

# O log de requisições imprime o corpo inteiro, incluindo as senhas em claro de
# /auth/login, /auth/register e /profile. Nunca ligado em produção.
app.request-logging.enabled=false

# Origens permitidas, separadas por vírgula. "*" liberaria a API para qualquer site.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://tempo-claro-tcc-tsi.vercel.app}

# A documentação interativa não fica exposta em produção (§5.1 da monografia:
# apenas registro e login são rotas públicas).
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ===============================
# E-MAIL (SMTP) — igual ao perfil de dev. Default vazio (em vez de exigir a
# variável, como jwt.secret) é deliberado: sem MAIL_USERNAME/MAIL_PASSWORD no
# Render, o deploy continua subindo normalmente — só o envio de código falha
# (logado, não derruba a requisição, ver SmtpEmailService) até a "Senha de
# app" do Gmail ser configurada no painel.
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===============================
# CÓDIGO DE VERIFICAÇÃO FIXO — MEDIDA PROVISÓRIA, REMOVER.
#
# O plano gratuito do Render bloqueia saída nas portas SMTP 25, 465 e 587 desde
# 26/09/2025. O SMTP acima está correto e funciona localmente, mas em produção a
# conexão nunca se estabelece: nenhum código de verificação ou recuperação chega
# ao usuário, e a falha é silenciosa (SmtpEmailService é @Async).
#
# Enquanto isso, todo código emitido é este valor. RISCO: com um código fixo,
# conhecer o e-mail de alguém basta para assumir a conta pelo fluxo de
# recuperação de senha. Vale só até o envio real existir — seja por instância
# paga do Render (libera 465/587), seja por API HTTPS (Brevo, SendGrid).
#
# Para desligar: defina CODIGO_VERIFICACAO_FIXO vazio no painel do Render, ou
# apague esta linha. Nada mais precisa mudar; o sorteio volta sozinho.
# ===============================
app.verificacao.codigo-fixo=${CODIGO_VERIFICACAO_FIXO:123456}

# ===============================
# HIKARI
# ===============================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
