# ===============================
# BANCO DE DADOS POSTGRESQL NEON
#
# Nada de credencial literal neste arquivo: ele é versionado e o repositório é
# público. As três variáveis abaixo são obrigatórias no ambiente (painel do
# Render) — sem elas a aplicação não sobe, que é o comportamento desejado.
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Inicialização do banco (Cria as tabelas usando schema.sql)
spring.sql.init.mode=always

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Porta dinâmica (se necessária pela plataforma cloud)
server.port=${PORT:8084}

# ===============================
# SEGURANÇA
# ===============================
# Sem default: um segredo de assinatura embutido no código-fonte versionado não é
# segredo nenhum. HS512 exige pelo menos 64 bytes — JwtConfig confere na subida.
jwt.secret=${JWT_SECRET}

# O log de requisições imprime o corpo inteiro, incluindo as senhas em claro de
# /auth/login, /auth/register e /profile. Nunca ligado em produção.
app.request-logging.enabled=false

# Origens permitidas, separadas por vírgula. "*" liberaria a API para qualquer site.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://tempo-claro-tcc-tsi.vercel.app}

# A documentação interativa (Swagger) não fica exposta em produção: só as rotas
# de autenticação e o /api/health são públicas.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ===============================
# E-MAIL (RESEND) — antes era SMTP direto (Gmail). O plano gratuito do Render
# bloqueia saída nas portas SMTP 25, 465 e 587 desde 26/09/2025: o SMTP antigo
# funcionava local mas nunca entregava em produção. A API do Resend é HTTP/HTTPS
# (porta 443), que o Render não bloqueia. O envio é síncrono: uma falha chega ao
# cadastro como erro, em vez de se perder em segundo plano.
#
# app.resend.from precisa ser um endereço do domínio verificado na conta do
# Resend (painel > Domains) — o domínio de teste onboarding@resend.dev só
# entrega para o e-mail do próprio dono da conta, não serve para usuários reais.
# ===============================
app.resend.api-key=${RESEND_API_KEY:}
app.resend.from=${RESEND_FROM_EMAIL:}

# @audit-issue - 10.1 (Cadastro) [outcome: fixed] este arquivo tinha
# app.verificacao.codigo-fixo=${CODIGO_VERIFICACAO_FIXO:123456}, contorno de quando o SMTP
# não entregava em produção (ver bloco E-MAIL acima): todo código de cadastro e de
# recuperação de senha virava 123456, e quem soubesse o e-mail de um usuário assumia a
# conta pelo "esqueci minha senha". Corrigido removendo a linha; sem valor, vale o sorteio
# aleatório de CodigoVerificacaoService. Uma variável CODIGO_VERIFICACAO_FIXO definida no
# painel do Render ainda teria precedência, por isso ela também precisa sair de lá.
# Ver README §8 > Cadastro > item 10.

# ===============================
# HIKARI
# ===============================
spring.datasource.hikari.maximum-pool-size=5
# Sem conexão ociosa fixa: o Neon gratuito suspende o banco quando fica parado, e uma conexão
# mantida aberta só voltaria quebrada depois disso.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000

# O plano gratuito do Render tem 512 MB; poucas threads bastam para o volume de um app pessoal.
server.tomcat.threads.max=20
