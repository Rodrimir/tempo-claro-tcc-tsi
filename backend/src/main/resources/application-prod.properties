# ===============================
# BANCO DE DADOS POSTGRESQL NEON
#
# Nada de credencial literal neste arquivo: ele é versionado e o repositório é
# público. As três variáveis abaixo são obrigatórias no ambiente (painel do
# Render) — sem elas a aplicação não sobe, que é o comportamento desejado.
#
# ATENÇÃO: a senha que ficava aqui está no histórico do Git. Removê-la do arquivo
# não a torna secreta — ela precisa ser ROTACIONADA no painel da Neon.
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Inicialização do banco (Cria as tabelas usando schema.sql)
spring.sql.init.mode=always

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Porta dinâmica (se necessária pela plataforma cloud)
server.port=${PORT:8084}

# ===============================
# SEGURANÇA
# ===============================
# Sem default: um segredo de assinatura embutido no código-fonte versionado não é
# segredo nenhum. HS512 exige pelo menos 64 bytes — JwtConfig confere na subida.
jwt.secret=${JWT_SECRET}

# O log de requisições imprime o corpo inteiro, incluindo as senhas em claro de
# /auth/login, /auth/register e /profile. Nunca ligado em produção.
app.request-logging.enabled=false

# Origens permitidas, separadas por vírgula. "*" liberaria a API para qualquer site.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://tempo-claro-tcc-tsi.vercel.app}

# A documentação interativa não fica exposta em produção (§5.1 da monografia:
# apenas registro e login são rotas públicas).
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ===============================
# E-MAIL (RESEND) — antes era SMTP direto (Gmail). O plano gratuito do Render
# bloqueia saída nas portas SMTP 25, 465 e 587 desde 26/09/2025: o SMTP antigo
# funcionava local mas nunca entregava em produção, e a falha era silenciosa
# (ResendEmailService/antigo SmtpEmailService são @Async). A API do Resend é
# HTTP/HTTPS (porta 443), que o Render não bloqueia.
#
# app.resend.from precisa ser um endereço do domínio verificado na conta do
# Resend (painel > Domains) — o domínio de teste onboarding@resend.dev só
# entrega para o e-mail do próprio dono da conta, não serve para usuários reais.
# ===============================
app.resend.api-key=${RESEND_API_KEY:}
app.resend.from=${RESEND_FROM_EMAIL:}

# ===============================
# CÓDIGO DE VERIFICAÇÃO FIXO — RETIRADO.
#
# Existia como contorno enquanto o SMTP não entregava em produção (ver bloco
# E-MAIL acima): todo código emitido virava o valor de CODIGO_VERIFICACAO_FIXO,
# o que era um risco de segurança (conhecer o e-mail de alguém bastava para
# assumir a conta pelo fluxo de recuperação de senha). Com o Resend entregando
# de verdade, o sorteio aleatório de CodigoVerificacaoService volta a valer
# sozinho — não é preciso declarar app.verificacao.codigo-fixo aqui.
#
# IMPORTANTE: se a variável CODIGO_VERIFICACAO_FIXO ainda estiver definida no
# painel do Render, ela continua tendo efeito mesmo com esta linha removida —
# apague-a também lá.
# ===============================

# ===============================
# HIKARI
# ===============================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
