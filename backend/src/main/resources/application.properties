# ===============================
# BANCO DE DADOS (Postgres do compose — mesmo banco do pgAdmin em :8093)
# Container postgres_db, exposto no host em localhost:5433
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5433/backend_db
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always
server.port=8082
# ===============================
# DOKER
# ===============================
spring.docker.compose.readiness.wait=always
spring.docker.compose.enabled=false
# ===============================
# HIKARI
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
# ===============================
# JACKSON
# ===============================
# E2.9 (item 1) — antes, um campo com nome errado ou de mais no JSON era
# silenciosamente ignorado (o que já causou 3 campos descartados sem aviso
# nenhum, ver docs/CONTRATO_API.md). Vale pra TODO @RequestBody do projeto,
# não só hábitos — é puramente uma configuração de desserialização, nunca
# afeta o que o backend DEVOLVE (só o que ele aceita receber).
spring.jackson.deserialization.fail-on-unknown-properties=true

# ===============================
# LOGS
# ===============================
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.jdbc.core.namedparam.NamedParameterJdbcTemplate=DEBUG