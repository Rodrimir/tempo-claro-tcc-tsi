# ===============================
# BANCO DE DADOS (Postgres do compose — mesmo banco do pgAdmin em :8093)
# Container postgres_db, exposto no host em localhost:5433
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5433/backend_db
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always
server.port=8084
# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# ===============================
# DOKER
# ===============================
spring.docker.compose.readiness.wait=always
spring.docker.compose.enabled=false
# ===============================
# HIKARI
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
# ===============================
# SEGURANÇA (valores de DESENVOLVIMENTO)
#
# Este arquivo é o perfil default, usado na máquina do dev. O perfil prod
# sobrescreve os três valores abaixo exigindo variáveis de ambiente.
# ===============================
# Chave de assinatura só para rodar local. HS512 exige 64 bytes ou mais.
jwt.secret=${JWT_SECRET:desenvolvimento-local-tempo-claro-chave-sem-valor-de-producao-0001}
jwt.expiration=86400000

# O log imprime o corpo das requisições (senhas em claro inclusive) — é uma
# ferramenta de desenvolvimento. Em prod fica desligado explicitamente.
app.request-logging.enabled=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081,http://localhost:19006}

# ===============================
# JACKSON
# ===============================
# E2.9 (item 1) — antes, um campo com nome errado ou de mais no JSON era
# silenciosamente ignorado (o que já causou 3 campos descartados sem aviso
# nenhum, ver docs/CONTRATO_API.md). Vale pra TODO @RequestBody do projeto,
# não só hábitos — é puramente uma configuração de desserialização, nunca
# afeta o que o backend DEVOLVE (só o que ele aceita receber).
spring.jackson.deserialization.fail-on-unknown-properties=true

# ===============================
# E-MAIL (SMTP) — PLANO_REESTRUTURACAO.md, B/C: código de verificação de
# cadastro e de recuperação de senha. Gmail exige uma "Senha de app" (não a
# senha normal da conta), gerada em myaccount.google.com/apppasswords com a
# verificação em duas etapas ativa. Por isso usuário/senha vêm de variável de
# ambiente — nunca literal aqui, mesmo neste arquivo de dev.
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

