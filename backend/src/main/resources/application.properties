# ===============================
# BANCO DE DADOS (Postgres do compose — mesmo banco do pgAdmin em :8093)
# Container postgres_db, exposto no host em localhost:5433
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5433/backend_db
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always
server.port=8084
# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# ===============================
# DOKER
# ===============================
spring.docker.compose.readiness.wait=always
spring.docker.compose.enabled=false
# ===============================
# HIKARI
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
# ===============================
# SEGURANÇA (valores de DESENVOLVIMENTO)
#
# Este arquivo é o perfil default, usado na máquina do dev. O perfil prod
# sobrescreve os três valores abaixo exigindo variáveis de ambiente.
# ===============================
# Chave de assinatura só para rodar local. HS512 exige 64 bytes ou mais.
jwt.secret=${JWT_SECRET:desenvolvimento-local-tempo-claro-chave-sem-valor-de-producao-0001}
jwt.expiration=86400000

# O log imprime o corpo das requisições (senhas em claro inclusive) — é uma
# ferramenta de desenvolvimento. Em prod fica desligado explicitamente.
app.request-logging.enabled=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081,http://localhost:19006}

# ===============================
# JACKSON
# ===============================
# E2.9 (item 1) — antes, um campo com nome errado ou de mais no JSON era
# silenciosamente ignorado (o que já causou 3 campos descartados sem aviso
# nenhum, ver docs/CONTRATO_API.md). Vale pra TODO @RequestBody do projeto,
# não só hábitos — é puramente uma configuração de desserialização, nunca
# afeta o que o backend DEVOLVE (só o que ele aceita receber).
spring.jackson.deserialization.fail-on-unknown-properties=true

# ===============================
# E-MAIL (RESEND) — PLANO_REESTRUTURACAO.md, B/C: código de verificação de
# cadastro e de recuperação de senha. Trocado de SMTP para a API HTTP do Resend
# (ResendEmailService) porque o plano gratuito do Render bloqueia saída SMTP —
# ver o comentário completo em application-prod.properties. app.resend.from
# precisa ser um endereço do domínio verificado na conta do Resend.
# ===============================
app.resend.api-key=${RESEND_API_KEY:}
app.resend.from=${RESEND_FROM_EMAIL:}

# ===============================
# CONTAS DE TESTE (CargaDeContasDeTeste): nove testadores (testador01 a
# testador09@monzai.com.br) e uma conta da banca, já verificadas. Desligado por
# padrão; senhas e e-mail da banca só pelo ambiente, nunca neste arquivo.
# ===============================
app.contas-teste.ativo=${CONTAS_TESTE_ATIVO:false}
app.contas-teste.senha=${CONTAS_TESTE_SENHA:}
app.contas-teste.email-banca=${CONTAS_TESTE_EMAIL_BANCA:}
app.contas-teste.senha-banca=${CONTAS_TESTE_SENHA_BANCA:}

