# Textos que a API devolve ao usuário em pt-BR (idioma padrão). A versão em inglês fica em
# mensagens_en.properties, com as mesmas chaves. Mensagens com {0} passam pelo MessageFormat:
# nelas, um apóstrofo precisa ser escrito duas vezes.

# Erros gerais
erro.interno=Erro interno no servidor.
erro.rotaNaoEncontrada=Rota não encontrada.
erro.metodoNaoAceito=Método {0} não é aceito nesta rota.
