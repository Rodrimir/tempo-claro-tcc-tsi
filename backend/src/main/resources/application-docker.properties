
spring.datasource.url=jdbc:postgresql://db:5432/backend_db
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver

# Cria as tabelas e os seeds automaticamente no boot
spring.sql.init.mode=always

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Porta que o compose mapeia (8082:8082)
server.port=8084

# Desativa o docker-compose do Spring: o banco já sobe pelo compose.yaml
spring.docker.compose.enabled=false

# ===============================
# HIKARI
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
